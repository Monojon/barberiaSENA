<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberShop | Login Administrador</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .login-hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('https://images.unsplash.com/photo-1512690196236-d5a23403f0aa?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
        }
    </style>
</head>

<body>
    <div class="login-hero">
        <div class="booking-container">
            <div class="logo" style="text-align: center; margin-bottom: 2rem; font-size: 2rem;">
                <span class="gold">ADMIN</span>LOGIN
            </div>
            <form id="login-form" class="glass-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="admin@barbershop.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-submit">Ingresar</button>
                <p id="error-msg"
                    style="color: #ff4d4d; font-size: 0.9rem; margin-top: 1rem; text-align: center; display: none;">
                    Credenciales incorrectas</p>
            </form>
            <div style="text-align: center; margin-top: 2rem;">
                <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">&larr;
                    Volver al inicio</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Simple check (in production this would be an API call)
            if (email === 'admin@barbershop.com' && password === 'admin123') {
                localStorage.setItem('isAdmin', 'true');
                window.location.href = 'admin.html';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        };
    </script>
</body>

</html>
